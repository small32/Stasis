name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix (for example 0.2.1)'
        required: true
        default: '0.2.1'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and publish macOS app
    runs-on: macos-26
    timeout-minutes: 45
    env:
      INPUT_VERSION: ${{ inputs.version }}
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select the newest installed Xcode
        run: |
          XCODE_PATH=$(python3 - <<'PY'
          import glob
          import re

          candidates = glob.glob('/Applications/Xcode_*.app')
          if not candidates:
              raise SystemExit('No versioned Xcode installation found on this runner')
          print(sorted(candidates, key=lambda p: [int(n) for n in re.findall(r'\d+', p)])[-1])
          PY
          )
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('stasis.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project stasis.xcodeproj \
            -scheme stasis-release \
            -derivedDataPath DerivedData

      - name: Build Release
        run: |
          xcodebuild \
            -project stasis.xcodeproj \
            -scheme stasis-release \
            -configuration Release \
            -derivedDataPath DerivedData \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify embedded helpers
        run: |
          APP="DerivedData/Build/Products/Release/stasis.app"
          test -d "$APP" || { echo "::error::stasis.app was not produced"; exit 1; }
          test -f "$APP/Contents/Library/LaunchDaemons/com.srimanachanta.stasis.charging-helper.plist" \
            || { echo "::error::charging-helper LaunchDaemon plist is missing"; exit 1; }
          test -d "$APP/Contents/XPCServices/helper.xpc" \
            || { echo "::error::helper.xpc was not embedded"; exit 1; }
          echo "Bundle contents verified:"
          ls -la "$APP/Contents/XPCServices"
          ls -la "$APP/Contents/Library/LaunchDaemons"

      - name: Package archive
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          APP="DerivedData/Build/Products/Release/stasis.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Stasis-${VERSION}-macOS-arm64.zip"
          shasum -a 256 "Stasis-${VERSION}-macOS-arm64.zip" > "Stasis-${VERSION}-macOS-arm64.zip.sha256"
          ls -lh Stasis-*.zip Stasis-*.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stasis-macOS-arm64
          path: |
            Stasis-*.zip
            Stasis-*.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v${INPUT_VERSION}"
          else
            TAG="$REF_NAME"
          fi
          cat > release-notes.md <<'EOF'
          ### What is in this build

          - Complete Simplified Chinese interface, including menu bar dashboard, settings and notifications.
          - In-app language switcher: **Settings -> General -> Language** (Follow System / 简体中文 / English). Changing it restarts Stasis.
          - Apple Silicon only, macOS 14.8 or later.

          ### Signing notice

          This build is produced on GitHub-hosted runners with **no Apple Developer signing certificate**, so it is unsigned. After dragging Stasis into `/Applications`, run:

          ```
          xattr -cr /Applications/Stasis.app
          ```

          The privileged charging helper is registered through `SMAppService` and normally requires a valid signature. Charge-management features may be limited in this unsigned build. Use a Developer ID signed build for full functionality.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, replacing assets"
            gh release upload "$TAG" Stasis-*.zip Stasis-*.zip.sha256 --clobber
          else
            gh release create "$TAG" Stasis-*.zip Stasis-*.zip.sha256 \
              --title "Stasis $TAG" \
              --notes-file release-notes.md
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
